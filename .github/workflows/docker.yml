name: Publish Docker image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-hub-publish
  cancel-in-progress: false
  queue: max

env:
  IMAGE_NAME: maretu01/ai-trust-dashboard

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged version
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Verify image tag rules
        run: node --test .github/scripts/image-tags.test.mjs

      - name: Validate version and main ancestry
        id: image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          node .github/scripts/image-tags.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ai-trust-dashboard:ci
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,scope=docker-release,mode=max

      - name: Verify container and static assets
        run: node .github/scripts/docker-smoke.mjs ai-trust-dashboard:ci

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: maretu01
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.commit }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=docker-release
          cache-to: type=gha,scope=docker-release,mode=max
